<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A local-first web security learning lab with guided lessons and hints.">
  <meta name="theme-color" content="#10151d">
  <title>SecureLab | Web Security Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="#" aria-label="SecureLab home"><span class="brand-mark">S</span><span>secure<span class="brand-light">lab</span></span></a>

      <div class="sidebar-footer">SECURELAB <span>v1.0.0</span></div>

      <div class="breadcrumb"><span>CURRICULUM</span><span>/</span><span id="crumb-current">INTRODUCTION</span></div>
      <div id="lesson-content" aria-live="polite"></div>
    </section>
  </main>
  <footer class="mobile-footer">Built for curious minds. Practice safely. <span>✳</span></footer>
